services:
  - type: web
    name: colorfit-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_BACKEND
        value: r2
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: MAX_UPLOAD_SIZE
        value: "10485760"
      - key: MAX_IMAGE_WIDTH
        value: "512"
      - key: MAX_IMAGE_HEIGHT
        value: "512"
      - key: MAX_PIXEL_COUNT
        value: "262144"
      - key: IMAGE_TTL_HOURS
        value: "24"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_UPLOAD
        value: "30"
      - key: RATE_LIMIT_PROCESS
        value: "20"
      - key: RATE_LIMIT_DOWNLOAD
        value: "60"
